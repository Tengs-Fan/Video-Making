<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>scene</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
  /* Fonts: use an installed family, or @font-face to a local file next to this page. */
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Contract: drawFrame(f) paints frame f and reads nothing but f.
// No Date, performance.now, timers, requestAnimationFrame, CSS animation,
// network or Math.random inside it; use hash() for noise.

const W = 1920, H = 1080, FPS = 30, SECONDS = 15, FRAMES = FPS * SECONDS;

// Shot starts in seconds. The soundtrack and the contact sheet read these cues.
const SHOT = { a: 0, b: 4, c: 8, d: 12 };

window.VIDEO = {
  width: W, height: H, fps: FPS, frames: FRAMES,
  cues: {
    cuts: [SHOT.b, SHOT.c, SHOT.d],  // whoosh on each, sheet shows each cut +-0.2 s
    ticks: [],                       // key ticks (typing)
    pops: [],                        // something landing
    impact: SHOT.d + 1,              // the payoff, once
  },
};

const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

// Timing helpers: seg(t, a, b) is 0 before a, 1 after b, linear between.
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outBack = x => { const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// Deterministic noise in [0, 1) from an integer seed.
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296; }

const SANS = '"Inter", "Helvetica Neue", Arial, sans-serif';
function text(str, x, y, size, color, weight = 700, align = 'left', font = SANS) {
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(str, x, y);
}

function shotA(t) {
  ctx.fillStyle = '#1d3557'; ctx.fillRect(0, 0, W, H);
  // Frame 0 is the thumbnail: the subject is already on screen.
  text('Your title', 140, 520, 140, '#f1faee', 800);
  const p = outCubic(seg(t, 0.6, 1.2));
  ctx.globalAlpha = p;
  text('the line that follows', 140, 640, 64, '#a8dadc', 600);
  ctx.globalAlpha = 1;
}
function shotB(t) { ctx.fillStyle = '#f1faee'; ctx.fillRect(0, 0, W, H); text('Shot B', 140, 540, 120, '#1d3557'); }
function shotC(t) { ctx.fillStyle = '#457b9d'; ctx.fillRect(0, 0, W, H); text('Shot C', 140, 540, 120, '#f1faee'); }
function shotD(t) { ctx.fillStyle = '#e63946'; ctx.fillRect(0, 0, W, H); text('Shot D', 140, 540, 120, '#f1faee'); }

window.drawFrame = function (f) {
  const t = f / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  if (t < SHOT.b) shotA(t);
  else if (t < SHOT.c) shotB(t);
  else if (t < SHOT.d) shotC(t);
  else shotD(t);
};

// Preview loop for a normal browser; the renderer loads ?render and skips it.
if (!location.search.includes('render')) {
  let f = 0;
  const tick = () => { window.drawFrame(f); f = (f + 1) % FRAMES; requestAnimationFrame(tick); };
  document.fonts.ready.then(tick);
}
</script>
</body>
</html>
